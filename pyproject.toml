[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tef-sam"
version = "0.1.0"
description = "TeF-SAM image-only medical segmentation with frozen PRISM memory"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "TeF-SAM Contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "accelerate>=0.29,<2.0",
  "einops>=0.7,<0.9",
  "monai>=1.0,<1.6",
  "numpy>=1.24,<2.0",
  "Pillow>=10.0,<12.0",
  "PyYAML>=6.0,<7.0",
  "safetensors>=0.4,<0.6",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66,<5.0",
  "transformers>=4.40,<5.0",
]

[project.scripts]
tefsam-train = "tefsam.engine.runtime:train_main"
tefsam-evaluate = "tefsam.engine.runtime:evaluate_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["tefsam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py38"
